[project]
name = "kasi-compass"
version = "0.1.0"
description = "Train Journey Mapper — Pretoria to Cape Town"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "BLE", # flake8-blind-except
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]
ignore = [
    "E501",  # line too long (handled by line-length)
    "I001",  # import block sorting (handled by isort)
]
fixable = ["ALL"]
unfixable = ["BLE001", "TID251"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "tools"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "app.*"
strict = false

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tools.*"
strict = false
ignore_missing_imports = true