<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasi Compass — Train Journey Mapper</title>
    <script src="js/config.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="app">
        <header role="banner">
            <h1>Kasi Compass</h1>
            <p class="tagline">Every stop tells a story.</p>
        </header>

        <nav id="mode-switcher" role="navigation" aria-label="Journey mode">
            <button id="btn-explorer" class="active" aria-pressed="true">Explorer Mode</button>
            <button id="btn-companion" aria-pressed="false">Companion Mode</button>
        </nav>

        <main id="main-content" role="main">
            <div id="language-switcher" role="group" aria-label="Story language">
                <label for="language-select">Story language:</label>
                <select id="language-select">
                    <option value="en" selected>English</option>
                    <option value="zu">isiZulu</option>
                    <option value="af">Afrikaans</option>
                    <option value="xh">isiXhosa</option>
                    <option value="nso">Sepedi</option>
                    <option value="tn">Setswana</option>
                    <option value="st">Sesotho</option>
                    <option value="ts">Xitsonga</option>
                    <option value="ss">siSwati</option>
                    <option value="ve">Tshivenda</option>
                    <option value="nr">isiNdebele</option>
                    <option value="sw">Kiswahili</option>
                    <option value="am">Amharic</option>
                    <option value="ha">Hausa</option>
                    <option value="yo">Yoruba</option>
                    <option value="ar">Arabic</option>
                    <option value="fr">French</option>
                    <option value="pt">Portuguese</option>
                    <option value="de">German</option>
                    <option value="es">Spanish</option>
                    <option value="zh">Chinese</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                </select>
            </div>

            <div id="map-container" role="application" aria-label="Interactive map of Pretoria to Cape Town rail corridor">
                <div id="map" aria-hidden="false"></div>
                <div id="story-card" class="hidden" role="dialog" aria-modal="true" aria-labelledby="story-title" aria-describedby="story-text">
                    <button id="close-story" aria-label="Close story">&times;</button>
                    <h2 id="story-title"></h2>
                    <p id="story-text"></p>
                    <p id="story-source"></p>
                </div>
            </div>

            <div id="controls">
                <div id="explorer-controls">
                    <button id="btn-start-journey" aria-label="Start explorer journey">Start Journey</button>
                    <button id="btn-pause-journey" disabled aria-label="Pause journey">Pause</button>
                    <div class="speed-control">
                        <label for="speed-slider">Speed:</label>
                        <input type="range" id="speed-slider" min="1" max="10" value="3" aria-label="Animation speed" aria-valuemin="1" aria-valuemax="10" aria-valuenow="3">
                        <span id="speed-value" aria-live="polite">3x</span>
                    </div>
                </div>
                <div id="companion-controls" class="hidden">
                    <button id="btn-gps" aria-label="Start GPS tracking">Start GPS Tracking</button>
                    <p id="gps-status" aria-live="polite">GPS inactive</p>
                </div>
            </div>

            <div id="journey-progress" role="region" aria-label="Journey progress">
                <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Journey progress">
                    <div id="progress-fill"></div>
                </div>
                <p id="progress-text" aria-live="polite">Ready to begin</p>
            </div>
        </main>

        <footer role="contentinfo">
            <p>Team NeoDev — Geekulcha Annual Hackathon 2026</p>
        </footer>
    </div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="js/geo.js"></script>
    <script src="js/api.js"></script>
    <script src="js/map.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
