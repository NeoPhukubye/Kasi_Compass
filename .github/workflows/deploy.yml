name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard - BACKEND_API_URL must be set
        run: |
          if [ -z "${{ vars.BACKEND_API_URL }}" ]; then
            echo "::error::Repository variable BACKEND_API_URL is not set (Settings > Secrets and variables > Actions > Variables)."
            echo "::error::Without it this deploy would silently ship http://localhost:8000 to production — failing instead."
            exit 1
          fi

      - name: Inject production backend URL
        run: |
          echo "window.KASI_API_BASE = '${{ vars.BACKEND_API_URL }}';" > frontend/js/config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
